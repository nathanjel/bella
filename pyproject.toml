[project]
name = "bella"
version = "0.0.1"
description = "Python -> C++26 converter: intent-level IR passes, exact CPython 3.15 semantics, GCC-only"
readme = "README.md"
license = "MIT"
# The reference build is CPython 3.15.2 (bella.toml). The compiler runs on the reference minor
# only: its L0 is the host `ast`, so the grammar it parses is the interpreter's. Anything that
# records conformance expectations or computes the dependency closure refuses other patch releases.
requires-python = "==3.15.*"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "ruff>=0.9",
  "mypy>=1.14",
  "z3-solver>=4.13",
]

[tool.uv]
# The uv release decides which python-build-standalone build of the pin is downloaded, so it is
# pinned exactly, here and in the Dockerfile (UV_IMAGE). Only uv-managed interpreters are
# used, so a developer machine runs the same CPython build as the image, not a distro build.
required-version = "==0.13.6"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tools/tests", "refmodel/tests", "pipeline/tests", "validation/tests", "runtime/tests", "conformance/tests"]
addopts = "-q"

# --- Dialect input contract (design document, section 2) --------------------------------
# These rules apply to *programs Bella compiles*, which in this repository means the
# conformance corpus and the pipeline examples. The compiler's own code is Python that
# runs under CPython and is held to the ordinary rules below it.
[tool.ruff]
line-length = 100
target-version = "py315"
# targets/vendor holds verbatim snapshots of third-party libraries (never edited), and
# targets/data the fixed inputs, among them a file pycodestyle must find faults in.
extend-exclude = ["targets/vendor", "targets/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "PGH", "S102", "S307"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Dialect programs: annotations everywhere, no Any, no blanket ignores, no exec/eval,
# no star imports, literal attribute names.
"conformance/cases/**" = []
"pipeline/examples/**" = []
"**/tests/**" = ["ANN", "S101"]

[tool.ruff.lint.extend-per-file-ignores]
# ANN401 (no Any) and the dialect-only selectors are enabled for dialect programs only.
"conformance/cases/**" = []

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
# disallow_any_explicit is the dialect's rule for compiled programs; the compiler itself
# legitimately handles `ast` and dynamic values, so it is applied per package below.
packages = ["refmodel", "pipeline", "tools", "validation"]

[[tool.mypy.overrides]]
module = ["z3", "z3.*"]        # z3-solver ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["conformance.cases.*"]
disallow_any_explicit = true
