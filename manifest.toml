# manifest.toml -- the phase-1 standard-library manifest (dialect specification v0.5, section 7).
#
# `make closure` (tools/closure.py) computes the import closure of [phase1].roots against the
# pinned CPython and fails if any required module is not listed in compiled, mapped, core or
# shim, if an optional import outside the manifest is not declared in [omissions], or if a lazy
# import outside the manifest is not declared in [lazy_unsupported]. Import guards the closed
# world can evaluate are decided by [platform] (review log D-3).
#
# Status meanings
#   compiled : pure-Python stdlib module compiled through the Bella pipeline
#   mapped   : C module replaced by a runtime facility or a licensed library (study, section 12)
#   core     : interpreter-core builtin provided by the runtime itself (sys, builtins, _imp, ...)
#   shim     : phase-1 stand-in with reduced behaviour, named in [adaptations]
#
# THIS FILE WAS LAST RECONCILED ON CPython 3.13.18 (non-authoritative). Gate 0, task 1 is to
# rerun `make closure` on the pinned 3.15.2 and reconcile the lists.

[reference]
python = "3.15.2"

[platform]
# The target platform as the closed world knows it (review log D-3, 2026-11-01). The closure tool
# evaluates an import guard that reads only these facts, `__name__`, constants and module-level
# names bound once to such values: an import under a false guard is dead on the target (never
# executed, never compiled, no entry needed), one under a true guard counts as unguarded. Any
# other `if` makes its imports lazy inside a function and required at module level. The tool
# checks these facts against the interpreter it runs on.
"sys.platform" = "linux"
"os.name" = "posix"
# Membership tests against sys.builtin_module_names (os.py) are answered for these names only.
builtin_modules_present = ["posix"]
builtin_modules_absent = ["nt"]

[phase1]
# The modules the dialect promises in phase 1 (spec, section 7). Everything they pull in must
# be accounted for below.
roots = [
  # core data
  "collections", "collections.abc", "itertools", "functools", "operator", "enum", "dataclasses",
  "typing", "abc", "copy", "copyreg", "types", "contextlib", "weakref", "contextvars", "bisect",
  "heapq", "keyword", "reprlib",
  # text
  "string", "re", "textwrap", "difflib", "json", "csv", "struct", "base64", "binascii", "codecs",
  "html", "urllib.parse",
  # numbers
  "math", "cmath", "decimal", "fractions", "random", "statistics", "numbers",
  # dates
  "datetime", "time", "calendar",
  # files and os
  "os", "os.path", "pathlib", "io", "shutil", "tempfile", "glob", "fnmatch", "stat", "errno", "sys",
  # process and signals
  "signal", "atexit", "gc",
  # hashing
  "hashlib", "hmac", "secrets", "uuid",
  # development
  "logging", "argparse", "warnings", "unittest", "pprint", "traceback",
  # internationalisation subset
  "gettext", "locale",
  # compression
  "zlib",
]

compiled = [
  "__future__", "abc", "argparse", "ast", "base64", "bisect", "calendar", "codecs", "collections",
  "collections.abc", "contextlib", "contextvars", "copy", "copyreg", "csv", "dataclasses",
  "datetime", "decimal", "difflib", "dis", "encodings", "encodings.aliases",
  "enum", "fnmatch", "fractions", "functools", "genericpath", "gettext", "glob", "hashlib",
  "heapq", "hmac", "html", "html.entities", "inspect", "io", "ipaddress", "json", "json.decoder",
  "json.encoder", "json.scanner", "keyword", "linecache", "locale", "logging", "ntpath", "numbers",
  "opcode", "operator", "os", "os.path", "pathlib", "pathlib._abc", "pathlib._local", "posixpath",
  "pprint", "random", "re", "re._casefix", "re._compiler", "re._constants", "re._parser",
  "reprlib", "secrets", "shutil", "signal", "stat", "statistics", "string", "struct",
  "tempfile", "textwrap", "token", "tokenize", "traceback", "types", "typing", "unittest",
  "unittest.async_case", "unittest.case", "unittest.loader", "unittest.main", "unittest.result",
  "unittest._log", "unittest.runner", "unittest.signals", "unittest.suite", "unittest.util", "urllib",
  "urllib.parse", "uuid", "warnings", "weakref", "_collections_abc", "_colorize",
  "_opcode_metadata", "_pydatetime", "_pydecimal", "_py_abc", "_weakrefset",
  "_strptime",
]

mapped = [
  "atexit", "binascii", "cmath", "errno", "gc", "grp", "itertools", "pwd",
  "time", "unicodedata", "zlib", "_bisect", "_blake2", "_collections", "_contextvars",
  "_csv", "_datetime", "_decimal", "_functools", "_hashlib", "_heapq", "_json", "_locale", "_md5",
  "_opcode", "_operator", "_random", "_sha1", "_sha2", "_sha3", "_socket", "_sre", "_stat",
  "_statistics", "_string", "_struct", "_typing", "_uuid", "math",
]

core = [
  "builtins", "sys", "marshal", "posix", "_abc", "_codecs", "_frozen_importlib",
  "_frozen_importlib_external", "_imp", "_io", "_signal", "_thread", "_warnings", "_weakref",
  "importlib", "importlib._abc", "importlib._bootstrap", "importlib._bootstrap_external",
  "importlib.machinery", "importlib.util", "zipimport", "_tokenize", "_suggestions", "_ast",
]

[phase1.shim]
threading = "single-threaded shim: Lock, RLock, local, Event, current_thread; creating a thread raises with the milestone name"
_thread = "single-threaded primitives behind the threading shim"
socket = "import succeeds for logging.handlers type hints; sockets are [P2+]"
subprocess = "import succeeds; every API raises with the milestone name"
asyncio = "import succeeds for unittest.async_case; async is [P2+]"
codeop = "for traceback only (review log D-4): the PyCF_* flags with CPython's values; compile_command, Compile and CommandCompiler stop the program with the E-08 refusal, which except clauses cannot catch. A program's own import of codeop stays a compile-time error (E-08)"

[adaptations]
# Named adaptations the closure relies on (spec, section 7): without them these roots are open.
logging = "findCaller receives call-site information from the compiler instead of sys._getframe (E-02)"
traceback = "formatting from source maps; file and line in release builds (D-06); imports the codeop shim, reached only to suggest a keyword for a SyntaxError carrying parser metadata (review log D-4)"
contextvars = "single-threaded implementation over _contextvars mapping"
locale = "C and UTF-8 locales only; the rest of locale is [P2+]"
decimal = "C accelerator omitted so the pure-Python _pydecimal is used (see [omissions])"
datetime = "C accelerator omitted so the pure-Python _pydatetime is used (see [omissions])"

[lazy_unsupported]
# Imports inside functions whose target is outside the manifest: the importing function is
# not supported in phase 1 (calling it raises with the milestone name). This is support per
# API: difflib is in, difflib._test (which imports doctest) is not.
difflib = ["doctest"]            # difflib._test
base64 = ["getopt"]              # base64.main (the command-line entry point)
shutil = ["tarfile", "zipfile"]  # shutil.make_archive / unpack_archive: archive formats are [P2+]
logging = ["pickle"]             # Logger.__reduce__ for a logger that is not the registered one (D-3)

[omissions]
# Optional imports (try/except ImportError, suppress(ImportError)) whose target is outside the
# manifest, and nothing else (review log D-3). Each resolves to ImportError at runtime, as if
# the module were not installed, and the importer takes its fallback path.
# 2026-11-01 (D-3): the platform-guarded entries (nt, _winapi, posix, platform, doctest under
# `__name__ == "__main__"`) are dead on the target and left this table; logging's pickle import
# is lazy and moved to [lazy_unsupported]; entries 3.15.2 no longer imports were removed.
decimal = ["_decimal"]
datetime = ["_datetime"]
shutil = ["bz2", "lzma"]
random = ["_sha2"]
hashlib = ["_hashlib"]
unittest = []
_py_warnings = ["tracemalloc"]   # 3.15 moved warnings' implementation here
pathlib = ["pwd", "grp"]
"pathlib._local" = ["pwd", "grp"]
"pathlib._abc" = []
uuid = ["_uuid"]
locale = ["_locale"]
gettext = []
calendar = []

[excluded]
# Dialect specification, section 4: reaching one of these as a required import is an error.
# codeop is E-08 for programs but a shim for traceback (review log D-4), so it is not listed here.
modules = [
  "code", "pdb", "bdb", "doctest", "tracemalloc", "cProfile", "profile", "profiling",
  "pydoc", "timeit", "ctypes.pythonapi",
]
