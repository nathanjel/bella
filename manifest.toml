# manifest.toml -- the phase-1 standard-library manifest (dialect specification v0.7, section 7).
#
# `make closure` (tools/closure.py) computes the import closure of [phase1].roots against the
# pinned CPython and fails if any required module is not listed in compiled, mapped, core or
# shim, if an optional import outside the manifest is not declared in [omissions], if a lazy
# import outside the manifest is not declared in [lazy_unsupported], or if an import with a
# computed name has not been reviewed in [dynamic]. Import guards the closed world can evaluate
# are decided by [platform] (review log D-3); functions an adaptation replaces are named in
# [replaced]. A module has exactly one status, and a module the manifest provides is never omitted.
#
# Status meanings
#   compiled : pure-Python stdlib module compiled through the Bella pipeline
#   mapped   : C module replaced by a runtime facility or a licensed library (study, section 12)
#   core     : interpreter-core builtin provided by the runtime itself (sys, builtins, _imp, ...)
#   shim     : phase-1 stand-in with reduced behaviour, named in [adaptations]
#
# Reconciled on the pinned CPython 3.15.2 on 2026-11-01 (Gate 0, task 1): 174 modules, recorded
# in closure.lock.json, which CI requires to match what the pinned image computes. After any
# change here, run `make closure` and commit the lock with it.

[reference]
python = "3.15.2"

[platform]
# The target platform as the closed world knows it (review log D-3, 2026-11-01). The closure tool
# evaluates an import guard that reads only these facts, `__name__`, constants and module-level
# names bound once to such values: an import under a false guard is dead on the target (never
# executed, never compiled, no entry needed), one under a true guard counts as unguarded. Any
# other `if` makes its imports lazy inside a function and required at module level. The tool
# checks these facts against the interpreter it runs on.
"sys.platform" = "linux"
"os.name" = "posix"
# Membership tests against sys.builtin_module_names (os.py) are answered for these names only.
builtin_modules_present = ["posix"]
builtin_modules_absent = ["nt"]

[phase1]
# The modules the dialect promises in phase 1 (spec, section 7). Everything they pull in must
# be accounted for below.
roots = [
  # core data
  "collections", "collections.abc", "itertools", "functools", "operator", "enum", "dataclasses",
  "typing", "abc", "copy", "copyreg", "types", "contextlib", "weakref", "contextvars", "bisect",
  "heapq", "keyword", "reprlib",
  # text
  "string", "string.templatelib", "re", "textwrap", "difflib", "json", "csv", "struct", "base64", "binascii", "codecs",
  "html", "urllib.parse", "unicodedata",   # unicodedata [P1] since 2026-11-01 (review log D-8)
  # numbers
  "math", "cmath", "decimal", "fractions", "random", "statistics", "numbers",
  # dates
  "datetime", "time", "calendar",
  # files and os
  "os", "os.path", "pathlib", "io", "shutil", "tempfile", "glob", "fnmatch", "stat", "errno", "sys",
  # process and signals
  "signal", "atexit", "gc",
  # hashing
  "hashlib", "hmac", "secrets", "uuid",
  # development
  "logging", "argparse", "warnings", "unittest", "pprint", "traceback",
  # internationalisation subset
  "gettext", "locale",
  # compression
  "zlib",
  # command lines and configuration files, admitted for pycodestyle (author, 2026-11-08; docs/targets.md section 5 item 3)
  "optparse", "configparser",
]

compiled = [
  "__future__", "abc", "argparse", "ast", "base64", "bisect", "calendar", "codecs", "collections", "configparser",
  "collections.abc", "contextlib", "contextvars", "copy", "copyreg", "csv", "dataclasses",
  "datetime", "decimal", "difflib", "dis", "encodings", "encodings.aliases",
  "encodings.ascii", "encodings.latin_1", "encodings.utf_8", "encodings.utf_8_sig",
  "encodings.utf_16", "encodings.utf_16_be", "encodings.utf_16_le", "encodings.utf_32",
  "encodings.utf_32_be", "encodings.utf_32_le",
  "enum", "fnmatch", "fractions", "functools", "genericpath", "gettext", "glob", "hashlib",
  "heapq", "hmac", "html", "html.entities", "inspect", "io", "ipaddress", "json", "json.decoder",
  "json.encoder", "json.scanner", "keyword", "linecache", "locale", "logging", "ntpath", "numbers",
  "opcode", "operator", "optparse", "os", "os.path", "pathlib", "pathlib._os", "posixpath",
  "pprint", "random", "re", "re._casefix", "re._compiler", "re._constants", "re._parser",
  "reprlib", "secrets", "shutil", "signal", "stat", "statistics", "string", "string.templatelib", "struct",
  "tempfile", "textwrap", "threading", "token", "tokenize", "traceback", "types", "typing", "unittest",
  "unittest.async_case", "unittest.case", "unittest.loader", "unittest.main", "unittest.result",
  "unittest._log", "unittest.runner", "unittest.signals", "unittest.suite", "unittest.util", "urllib",
  "urllib.parse", "uuid", "warnings", "weakref", "_colorize",
  "_opcode_metadata", "_pydatetime", "_pydecimal", "_py_abc", "_weakrefset",
  "_strptime", "_py_warnings", "_missing_stdlib_info",
  "_threading_local",   # threading's fallback under `from _thread import _local`, in a handler the closure cannot prove dead; never imported, since _thread has _local
  "_ast_unparse",   # ast.unparse: the annotationlib shim's FORWARDREF and STRING need it (decision S-1)
]

mapped = [
  "atexit", "binascii", "cmath", "errno", "gc", "grp", "itertools", "pwd",
  "time", "unicodedata", "zlib", "_bisect", "_blake2", "_collections", "_contextvars",
  "_csv", "_functools", "_heapq", "_json", "_locale", "_md5",
  "_opcode", "_operator", "_random", "_sha1", "_sha2", "_sha3", "_sre", "_stat",
  "_statistics", "_string", "_struct", "_typing", "math", "math.integer", "_math_integer", "_hmac",
]

core = [
  "builtins", "sys", "marshal", "posix", "_abc", "_codecs", "_frozen_importlib",
  "_frozen_importlib_external", "_imp", "_io", "_signal", "_warnings", "_weakref",
  "importlib", "importlib._abc", "importlib._bootstrap", "importlib._bootstrap_external",
  "importlib.machinery", "importlib.util", "zipimport", "_tokenize", "_suggestions", "_ast", "_types",
]

[phase1.shim]
_thread = "single-threaded primitives (runtime/prelude/_thread.py) under CPython's own threading module, which is compiled: locks, RLock, local, Event, Condition, Semaphore, the main thread; creating a thread raises with the milestone name"
socket = "import succeeds for logging.handlers type hints; sockets are [P2+]"
subprocess = "import succeeds; every API raises with the milestone name"
asyncio = "import succeeds for unittest.async_case; async is [P2+]"
annotationlib = "CPython's own module (runtime/shims/annotationlib.py) with eight marked changes: where CPython rebuilds an annotate function from __code__ against substitute globals and cells, it calls the second entry point the compiler generates for each __annotate__ (spec section 3, decision S-1 of docs/staging.md), so VALUE, FORWARDREF and STRING are CPython's. Evaluating the text of a reference or annotation (ForwardRef.evaluate of an expression, eval_str=True) raises with the milestone name, as does an annotate function the compiler did not generate. dataclasses, typing, functools and inspect use it while the module runs (spec section 8; cases C-3-13, C-3-21, C-3-22)"
_collections_abc = "CPython's own module (runtime/shims/_collections_abc.py) with one marked change: the generator, coroutine, async-generator and frame-locals-proxy types are imported from _types (core), as types.py does, instead of being probed by making a coroutine, an async generator and a frame (decision P-2, 2026-11-02; async is [P2+]). The objects are the same (case C-7-18)"
codeop = "for traceback only (review log D-4): the PyCF_* flags with CPython's values; compile_command, Compile and CommandCompiler stop the program with the E-08 refusal, which except clauses cannot catch. A program's own import of codeop stays a compile-time error (E-08)"

[adaptations]
# Named adaptations the closure relies on (spec, section 7): without them these roots are open.
logging = "findCaller receives call-site information from the compiler instead of sys._getframe (E-02)"
traceback = "formatting from source maps; file and line in release builds (D-06); imports the codeop shim, reached only to suggest a keyword for a SyntaxError carrying parser metadata (review log D-4); _find_incompatible_extension_module returns None, since a closed world has no extension module built for another Python version (see [replaced])"
contextvars = "single-threaded implementation over _contextvars mapping"
threading = "CPython's own module over the single-threaded _thread (see [phase1.shim]): Thread.start, and every wait only another thread could end, stop with the milestone name ([P2+]); the rest behaves as with one thread (2026-11-08, in place of a shim to write)"
locale = "C and UTF-8 locales only; the rest of locale is [P2+]"
decimal = "C accelerator omitted so the pure-Python _pydecimal is used (see [omissions])"
datetime = "C accelerator omitted so the pure-Python _pydatetime is used (see [omissions])"
hashlib = "the OpenSSL module _hashlib is omitted (see [omissions]): the built-in digests are mapped, and pbkdf2_hmac and scrypt, which only _hashlib provides, are absent, as in a CPython built without OpenSSL"
hmac = "_hashlib omitted; _hmac mapped like the digests (spec section 7: onto BearSSL or libsodium), so hmac behaves as in a CPython built without OpenSSL and hmac.digest still accepts any buffer as key (review log RL-61)"
encodings = "codec lookup finds the phase-1 codecs listed in [dynamic]; any other encoding raises LookupError (the full registry is [P2+])"

[lazy_unsupported]
# Imports inside functions whose target is outside the manifest: the importing function is
# not supported in phase 1 (calling it raises with the milestone name, on every path through
# it, also one that would not reach the import: author's decision 2026-11-01). This is support
# per API: base64 is in, base64.main (the command line, which imports getopt) is not. The lock
# lists the refused functions under "unsupported_functions". (difflib's entry for doctest left
# on 2026-11-01: 3.15 removed difflib._test.)
base64 = ["getopt"]              # base64.main (the command-line entry point)
shutil = ["tarfile", "zipfile"]  # shutil.make_archive / unpack_archive: archive formats are [P2+]
logging = ["pickle"]             # Logger.__reduce__, so copy.copy(logger) is refused too (D-3)
pathlib = ["urllib.request", "urllib.error"]   # Path.as_uri, Path.from_uri: urllib.request is [P2+]

[replaced]
# Functions an adaptation in [adaptations] replaces: their imports do not count.
traceback = ["_find_incompatible_extension_module"]   # imports importlib.resources.readers, which imports zipfile

# Every import whose name is computed (__import__(name), import_module(name)), reviewed site by
# site on 2026-11-01 (review log RL-56): one table per module, one key per site, "<function>:
# <name expression>". At runtime such an import is a lookup in the closed world (spec section 3):
# a module compiled into the program is found, any other raises ModuleNotFoundError. The listed
# modules are those the lookup must find in phase 1, followed by the closure; [] means none. A new
# site, or an entry whose site is gone, fails the closure.

[dynamic.encodings]
# the codec search: the phase-1 codecs (spec section 7, Text)
"search_function: 'encodings.' + modname" = [
  "encodings.ascii", "encodings.latin_1", "encodings.utf_8", "encodings.utf_8_sig",
  "encodings.utf_16", "encodings.utf_16_be", "encodings.utf_16_le", "encodings.utf_32",
  "encodings.utf_32_be", "encodings.utf_32_le",
]

[dynamic._py_warnings]
"_getcategory: module" = []       # a warning category named in -W or PYTHONWARNINGS

[dynamic.optparse]
"Values.read_module: modname" = []   # Values.read_module imports the module named by its caller; pycodestyle never calls it

[dynamic.inspect]
"_main: mod_name" = []             # the `python -m inspect` command line

[dynamic.traceback]
"_compute_suggestion_error: exc_value.name" = []   # the module an ImportError names, already imported

[dynamic."unittest.loader"]
# test modules by name; discovery finds only the test modules compiled into the program
"TestLoader.loadTestsFromName: module_name" = []
"TestLoader.discover: start_dir" = []
"TestLoader._get_module_from_name: name" = []

[dynamic."unittest.main"]
"TestProgram.__init__: module" = []   # the module unittest.main() runs, '__main__' by default

[refused]
# Functions of phase-1 modules that phase 1 refuses with the milestone's name when they run, and
# the refusal's text (docs/staging.md). Each is an exec of a text only known at runtime.
"gettext:c2py" = "[P2+] gettext: a catalogue's Plural-Forms header is compiled with exec at runtime (decision S-4, docs/staging.md)"

[unstaged]
# What a staging miss at these functions reports, instead of E-01 (docs/staging.md).
"annotationlib:ForwardRef.__forward_code__" = "[P2+] annotationlib: a ForwardRef built at runtime from a text the build did not see needs it compiled at runtime (spec section 3, decision S-1)"

[omissions]
# Optional imports (try/except ImportError, suppress(ImportError)) whose target is outside the
# manifest, and nothing else (review log D-3). Each resolves to ImportError at runtime, as if
# the module were not installed, and the importer takes its fallback path.
# 2026-11-01 (D-3): the platform-guarded entries (nt, _winapi, posix, platform, doctest under
# `__name__ == "__main__"`) are dead on the target and left this table; logging's pickle import
# is lazy and moved to [lazy_unsupported]; entries 3.15.2 no longer imports were removed.
# 2026-11-01 (closure on 3.15.2): an omitted module may not also be provided. _decimal,
# _datetime, _hashlib and _uuid left `mapped`; random's _sha2, pathlib's pwd and grp and locale's
# _locale left this table, since hashlib, posixpath and the locale subset need them mapped.
decimal = ["_decimal"]
datetime = ["_datetime"]
shutil = ["bz2", "lzma", "compression", "compression.zstd"]   # compression.zstd is [P2+], spec section 7
hashlib = ["_hashlib"]           # OpenSSL (Apache-2.0); see [adaptations]
hmac = ["_hashlib"]
_py_warnings = ["tracemalloc"]   # 3.15 moved warnings' implementation here
"pathlib._os" = ["fcntl", "_winapi"]   # fcntl: FICLONE cloning, copies fall back to read and write
ntpath = ["_winapi", "nt"]       # Windows-only modules, absent on the target (review log RL-53)
uuid = ["_uuid"]                 # libuuid; uuid1 takes the pure-Python path

[excluded]
# Dialect specification, section 4: reaching one of these as a required import is an error.
# codeop is E-08 for programs but a shim for traceback (review log D-4), so it is not listed here.
modules = [
  "code", "pdb", "bdb", "doctest", "tracemalloc", "cProfile", "profile", "profiling",
  "pydoc", "timeit", "ctypes.pythonapi",
]
