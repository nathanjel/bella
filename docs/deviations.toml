[deviations.D-27]
summary = "a program that holds no `warnings` module (it imports no library module written in Python, or none that reaches it) has its warnings printed by the runtime as CPython's C prints them when its import of `warnings` fails (Python/_warnings.c, get_warnings_attr and show_warning; Python/traceback.c, display_source_line). CPython imports `warnings` when the first warning is shown and prints through it. The line with the file, the line number, the category and the text is the same, and so is the source line of most warnings. What differs: `warnings` is not in sys.modules afterwards, nor what it imports (linecache); the source line is the file's line without the spaces, tabs and form feeds before it, where the module strips white space of every kind at both ends; a file not found by its name is looked for by the last part of its name in each directory of sys.path, where linecache joins the whole of a relative name; the text reaches sys.stderr in a write for each part (nine for a warning with its source line), not in one; whatever a write raises ends the printing and is dropped, where the module lets all but an OSError out of the call that warned"
status = "accepted"
