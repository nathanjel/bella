[deviations.D-07]
summary = "the order in which objects still alive at exit are finalised, and the step of the exit at which each finaliser runs (what it finds of its module's globals, sys and the builtins); but for the order CPython's reference guarantees (a module's globals whose names begin with a single underscore are deleted before its other globals); which objects are finalised is CPython's"
status = "accepted"
lint = "no"
note = "unspecified in CPython but for one order: its language reference does not guarantee that __del__ runs for objects alive at exit, and warns that the globals a finaliser needs may be deleted or None, but guarantees that globals whose name begins with a single underscore are deleted from their module before other globals (Doc/reference/datamodel.rst, 3.15.2, lines 2085-2087; _PyModule_ClearDict's two passes), which the runtime keeps (C-9-13's alive row). Whether what a file left open has buffered reaches the file depends on the order, in CPython too: with the collector disabled and a function defined, CPython 3.15.2 leaves such a file empty, where the runtime writes it (review F48, RL-985; corrected 2026-11-28, Question 59: A, the summary's 'a file left open is flushed and closed' removed). Sharpened by the author on 2026-11-24 (Question 39: B; it read 'finalisation order of module globals at exit'): the freedom is kept for a faster exit, which A (the exit's order promised as CPython's) would have closed. The exit's steps are CPython's (H4, RL-514; finalize_modules' steps), and within a step the runtime finalises in its own order, which differs from CPython's in 34 of 126 simple placements (review F48, RL-988: a list, a tuple, the collector disabled, two modules); a change to the steps gets a DECISIONS entry. C-9-13 keeps the rows of which objects are finalised; its rows of order and step are the runtime's choice, held by a design test"

