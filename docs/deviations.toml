# Deviation register (dialect specification v0.7, section 11), machine-readable.
# The conformance harness and bella-lint read this file. A difference from the reference CPython
# (bella.toml, 3.15.2) that is not listed here is a defect. Fields: status = accepted | decided | pending; lint = yes | partial | no;
# expires = the phase in which a temporary deviation ends, if any.

[deviations.D-01]
summary = "id() returns a runtime address that differs from CPython's and may be reused differently"
status = "accepted"
decision = 1
lint = "yes"
observable = "unobservable in value; identity relationships are preserved up to a consistent renaming within one run"

[deviations.D-02]
summary = "default __repr__ prints a different address after 'at 0x'"
status = "accepted"
decision = 1
lint = "yes"

[deviations.D-03]
summary = "'is' is true between equal small-integer immediates and between equal interned strings more often than in CPython"
status = "accepted"
decision = 1
lint = "yes"
note = "CPython itself warns on code that depends on this"

[deviations.D-04]
summary = "reference cycles are collected at a different moment and their members are finalised in a different order among themselves"
status = "accepted"
lint = "partial"
note = "PEP 442's cyclic sequence (weakrefs cleared, finalisers, resurrection check, clear) is kept; only timing and order among members differ"

[deviations.D-05]
summary = "set and frozenset iteration order"
status = "decided"
decision = 4
lint = "yes"
note = "CPython's set table algorithm is implemented, so order matches for value-hashed elements; identity-hashed elements are unobservable in CPython too"

[deviations.D-06]
summary = "traceback line text"
status = "decided"
decision = 6
lint = "yes"
note = "release builds print file and line only; debug builds reproduce CPython's format from source maps"

[deviations.D-07]
summary = "finalisation order of module globals at exit"
status = "accepted"
lint = "no"
note = "unspecified in CPython too"

[deviations.D-08]
summary = "runtime-generated human-readable wording of built-in exception messages"
status = "decided"
decision = 11
lint = "yes"
expires = "phase 2 (revisit)"
note = "structured and user-supplied payloads stay observable: user args, KeyError key, OSError errno/filename, StopIteration.value, UnicodeError fields, .name of AttributeError/NameError/ImportError; programs that branch on exempt wording are outside the guarantee; the harness masks wording per exception type"

[deviations.D-09]
summary = "assertions are active by default; a build-profile switch that strips them and makes __debug__ false is planned as the -O equivalent"
status = "decided"
decision = 7
lint = "yes"

[deviations.D-10]
summary = "return, break or continue leaving a finally block is a compile-time error (CPython warns: SyntaxWarning, PEP 765)"
status = "decided"
decision = 8
lint = "yes"

[deviations.D-11]
summary = "breakpoint() prints a warning and continues"
status = "decided"
decision = 9
lint = "yes"

[deviations.D-12]
summary = "__file__ is the source path recorded at build, not a path on the running machine"
status = "accepted"
lint = "yes"

[deviations.D-13]
summary = "str internal representation: PEP 393 kinds (Latin-1, UCS-2, UCS-4) with a cached UTF-8 copy; no observable difference intended"
status = "decided"
decision = 3
lint = "no"

[deviations.D-14]
summary = "hash randomisation uses SipHash-1-3 with the PYTHONHASHSEED protocol; a program that fixes the seed sees CPython's values only if the runtime's seeding matches CPython's"
status = "accepted"
decision = 5
lint = "no"
note = "seeding compatibility is a conformance clause"

[deviations.D-15]
summary = "UTF-8 mode is always on and cannot be turned off (PYTHONUTF8=0, -X utf8=0); PYTHONIOENCODING and encoding=\"locale\" are ignored and mean UTF-8 (narrowed in v0.4: CPython 3.15 has UTF-8 mode on by default, PEP 686)"
status = "decided"
decision = 10
lint = "yes"

[deviations.D-16]
summary = "sys.implementation.name is 'bella' and platform.python_implementation() is 'Bella'; sys.implementation.cache_tag and __spec__.cached are None, and importlib.util.cache_from_source raises NotImplementedError, as CPython does for an implementation with no bytecode cache"
status = "decided"
decision = 12
lint = "yes"
note = "cache_tag and __spec__.cached added by the author 2026-11-05: a compiled program has no .pyc, and the implementation says so"

[deviations.D-17]
summary = "recursion limit: a per-call depth counter raises RecursionError at sys.getrecursionlimit(), default 1000"
status = "decided"
decision = 2
lint = "yes"

[deviations.D-18]
summary = "PYTHONPATH, .pth and .start files, site, and the lazy-imports mode (PYTHON_LAZY_IMPORTS, -X lazy_imports; always normal) are ignored; sys.path reflects the build"
status = "accepted"
lint = "yes"

[deviations.D-19]
summary = "module objects are immortal; functions, classes and every other definition-time object are reference-counted like any other"
status = "accepted"
lint = "no"
note = "narrowed after review round three: a weak reference to a module never dies; compiled code and layouts are immortal metadata the program cannot observe"

[deviations.D-20]
summary = "modules the phase-1 manifest omits behave as not installed (spec section 7): hashlib.pbkdf2_hmac and hashlib.scrypt are absent and hashlib.algorithms_available equals algorithms_guaranteed (no OpenSSL); shutil.get_archive_formats() and get_unpack_formats() list only gztar, tar and zip (no bz2, lzma or zstd; calling the built-in formats is [P2+], C-7-04); a codec outside the phase-1 set raises LookupError; date.isocalendar()'s IsoCalendarDate has the repr CPython's pure-Python _pydatetime gives it, without the 'datetime.' prefix (C-7-09). Only the differences listed here are accepted: another difference between _pydatetime and the C accelerator is a defect until it is listed (review 2026-11-01 astra-low-05)"
status = "accepted"
lint = "partial"
observable = "measured on 3.15.2 with the omitted modules blocked: algorithms_available lacks md5-sha1, ripemd160, sha512_224, sha512_256 and sm3; get_archive_formats and get_unpack_formats list 3 formats instead of 6; repr(date.isocalendar()) is IsoCalendarDate(...) instead of datetime.IsoCalendarDate(...), found when the staging replay ran every case in the phase-1 configuration (docs/staging.md)"
note = "review log D-6, decided 2026-11-01. Lint flags pbkdf2_hmac, scrypt, algorithms_available, the missing archive format names, and codec names given as literals outside the phase-1 set; a computed codec name cannot be linted. Providing pbkdf2_hmac and scrypt in the runtime is a later task (TODO.md)"
expires = "phase 2 (revisit)"

[deviations.D-21]
summary = "a compiled program has no CPython installation: sys.executable is the program, sys.prefix, base_prefix, exec_prefix and base_exec_prefix the directory above the one it is in, and sys.version says bella and the compiler (sys.version_info is the pin's)"
status = "accepted"
lint = "yes"
note = "gettext, a P1 module, reads sys.base_prefix when it imports and argparse reads sys.executable, neither in the spec's sys surface; proposed and accepted by the author 2026-11-06, with the lint rule: a read of sys.executable is flagged, since a program that starts [sys.executable, '-m', ...] or [sys.executable, '-c', ...] starts itself, not an interpreter"


[deviations.D-23]
summary = "after `del obj.__dict__`, a method call `obj.m()` as the first thing asked of the object counts as a plain read and gives it an ordinary dict; CPython's call form asks nothing of the instance (_PyObject_GetMethod), so there the next plain read or write still decides which dict the object gets"
status = "accepted"
lint = "yes"
observable = "only the order in which the object's attribute values are released. Measured on 3.15.2: for a class whose keys are y, z, `del o.__dict__; o.m(); o.z = Z(); o.y = Y(); del o` releases y then z (a dict that shares the class's keys); a compiled program, eval1 and eval2 release z then y (an ordinary dict). No difference when the class defines __getattr__ or __getattribute__ (its call form is a read in CPython too), for an int's or a tuple's subclass (no values kept in the object), or when anything but a call comes first (C-3-58)"
note = "the author's decision of 2026-11-11, as a stop-gap to reconsider: the dropped state itself is in the reference model and the header and is exact; this row would need the compiler to tell a call's load from a plain one through L1, L2, the backend and both evaluators. Pinned by pipeline/tests/test_instance_dict.py, which fails when the two agree. Lint flags `del <expr>.__dict__` and `delattr(<expr>, \"__dict__\")`"
expires = "phase 2 (revisit)"
