status = "decided"
lint = "partial"
observable = "measured on 3.15.2 (2026-11-26; `pipeline/tests/test_review_2026_11_26_f48.py`, `ownmodules`, 132 modules, each imported by name with a weak reference that sys holds): the callback is called at the exit for 42 under CPython and never compiled (atexit, binascii, cmath, gc, grp, pwd, time, unicodedata, zlib, math, _bisect, _blake2, _collections, _contextvars, _csv, _functools, _heapq, _json, _locale, _md5, _opcode, _operator, _random, _sha1, _sha2, _sha3, _sre, _stat, _statistics, _string, _struct, _typing, _hmac, _frozen_importlib_external, _imp, _signal, _warnings, _weakref, _tokenize, _suggestions, _ast, _types); 89 agree (the modules compiled from Python die on both sides), and marshal, which CPython frees too, is not ported yet"
