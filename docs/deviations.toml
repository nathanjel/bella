status = "accepted"
lint = "no"
note = "unspecified in CPython too: its language reference does not guarantee that __del__ runs for objects alive at exit, and warns that the globals a finaliser needs may be deleted or None. Sharpened by the author on 2026-11-24 (Question 39: B; it read 'finalisation order of module globals at exit'): the freedom is kept for a faster exit, which A (the exit's order promised as CPython's) would have closed. The runtime follows CPython 3.15.2's order today (H4, RL-514; finalize_modules' steps); a change that relaxes it gets a DECISIONS entry. C-9-13 keeps the rows of which objects are finalised; its rows of order and step are the runtime's choice, held by a design test"

