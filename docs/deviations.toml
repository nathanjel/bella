observable = "measured on 3.15.2 (2026-11-15; case C-7-86, whose second expectation is CPython with the import of `warnings` blocked at start-up): a line with three spaces after it is printed with them; a line that begins with a vertical tab or a no-break space keeps it; `warn_explicit(..., 'nowhere/' + name, n)` prints the line of the file of that name in sys.path's first directory, where CPython with the module prints none; a sys.stderr whose third write fails gets two parts and the call returns, where CPython with the module makes one write; `sys.modules.get('warnings') is not None` is False afterwards. The filters, the registries and which warnings are shown do not differ: they are the C half's (`_warnings`), which every program has. With the import blocked by the program itself (`sys.modules['warnings'] = None`) CPython and a compiled program agree row for row (pipeline/tests/test_warnings_without_the_module.py)"
note = "the author's decision of 2026-11-14 (of three: link the library's core of 79 modules into every program, 34 MB against 72 MB; leave the stop by name; CPython's own fallback), taken with the first two differences named; the others were found while writing the increment (2026-11-15) and are listed so that none stays silent. Only a program that imports no library module written in Python lacks `warnings`: any of os, re, abc, enum, collections, functools, typing brings it. The program's own import of a module it does not hold still stops by name, after a warning as before one. No lint rule: whether a warning will be shown is not known before the program runs; the build knows whether the program holds `warnings` and could say so"

[deviations.D-28]
summary = "the report of an exception that the runtime prints itself ends with the exception's own message: the report of an uncaught exception, of `sys.excepthook` and `sys.__excepthook__`, and of an exception that can only be told of (in a `__del__`, an atexit callback, a generator's close). CPython has its `traceback` module print these reports (Python/pythonrun.c, _PyErr_Display calling traceback._print_exception_bltin), and the module adds to the last line of an AttributeError, a NameError, an ImportError and a ModuleNotFoundError what was probably meant (Lib/traceback.py, TracebackException.__init__: `. Did you mean: 'rate'?`, `. Did you mean '.total' instead of '.totl'?`, `. Did you mean to use a 'list' object?`, `. Did you forget to import 'fractions'?`), and puts `Standard library module 'x' was not found` in place of the message of a ModuleNotFoundError that names a module of the standard library. A compiled program's report has neither, whether or not the program holds `traceback`. Everything above the last line is the same, and so is the exception: its class, its attributes and `str()` of it. `traceback`'s own functions give the additions as CPython does (C-7-88). The report also has no colour, ever: CPython's `traceback` colours the report of an exception nothing caught when standard error is a terminal, and anywhere under PYTHON_COLORS=1 or FORCE_COLOR (Lib/_colorize.py, can_colorize; NO_COLOR, PYTHON_COLORS=0 and TERM=dumb turn it off); the report CPython prints without `traceback` is plain"
