# Deviation register (dialect specification v0.7, section 11), machine-readable.
# The conformance harness and bella-lint read this file. A difference from the reference CPython
# (bella.toml, 3.15.2) that is not listed here is a defect. Fields: status = accepted | decided | pending; lint = yes | partial | no;
# expires = the phase in which a temporary deviation ends, if any.

[deviations.D-01]
summary = "id() returns a runtime address that differs from CPython's and may be reused differently"
status = "accepted"
decision = 1
lint = "yes"
observable = "unobservable in value; identity relationships are preserved up to a consistent renaming within one run"

[deviations.D-02]
summary = "default __repr__ prints a different address after 'at 0x'"
status = "accepted"
decision = 1
lint = "yes"

[deviations.D-03]
summary = "'is' is true between equal small-integer immediates and between equal interned strings more often than in CPython"
status = "accepted"
decision = 1
lint = "yes"
note = "CPython itself warns on code that depends on this"

[deviations.D-04]
summary = "reference cycles are collected at a different moment and their members are finalised in a different order among themselves"
status = "accepted"
lint = "partial"
note = "PEP 442's cyclic sequence (weakrefs cleared, finalisers, resurrection check, clear) is kept; only timing and order among members differ"

[deviations.D-05]
summary = "set and frozenset iteration order"
status = "decided"
decision = 4
lint = "yes"
note = "CPython's set table algorithm is implemented, so order matches for value-hashed elements; identity-hashed elements are unobservable in CPython too"

[deviations.D-06]
summary = "traceback line text"
status = "decided"
decision = 6
lint = "yes"
note = "release builds print file and line only; debug builds reproduce CPython's format from source maps"

[deviations.D-07]
summary = "finalisation order of module globals at exit"
status = "accepted"
lint = "no"
note = "unspecified in CPython too"

[deviations.D-08]
summary = "runtime-generated human-readable wording of built-in exception messages"
status = "decided"
decision = 11
lint = "yes"
expires = "phase 2 (revisit)"
note = "structured and user-supplied payloads stay observable: user args, KeyError key, OSError errno/filename, StopIteration.value, UnicodeError fields, .name of AttributeError/NameError/ImportError; programs that branch on exempt wording are outside the guarantee; the harness masks wording per exception type"

[deviations.D-09]
summary = "assertions are active by default; a build-profile switch that strips them and makes __debug__ false is planned as the -O equivalent"
status = "decided"
decision = 7
lint = "yes"

[deviations.D-10]
summary = "return, break or continue leaving a finally block is a compile-time error (CPython warns: SyntaxWarning, PEP 765)"
status = "decided"
decision = 8
lint = "yes"

[deviations.D-11]
summary = "breakpoint() prints a warning and continues"
status = "decided"
decision = 9
lint = "yes"
note = "the warning is the one CPython's sys.breakpointhook gives for a hook it cannot import, a RuntimeWarning at the caller's line with the text 'Ignoring unimportable $PYTHONBREAKPOINT: \"pdb.set_trace\"' (the author's decision of 2026-11-14, over a text of Bella's own): what a CPython without pdb prints for the same program; nothing under PYTHONBREAKPOINT=0, as in CPython. The plain explanation is the lint rule's"

[deviations.D-12]
summary = "__file__ is the source path recorded at build, not a path on the running machine"
status = "accepted"
lint = "yes"

[deviations.D-13]
summary = "str internal representation: PEP 393 kinds (Latin-1, UCS-2, UCS-4) with a cached UTF-8 copy; no observable difference intended"
status = "decided"
decision = 3
lint = "no"

[deviations.D-14]
summary = "hash randomisation uses SipHash-1-3 with the PYTHONHASHSEED protocol; a program that fixes the seed sees CPython's values only if the runtime's seeding matches CPython's"
status = "accepted"
decision = 5
lint = "no"
note = "seeding compatibility is a conformance clause"

[deviations.D-15]
summary = "UTF-8 mode is always on and cannot be turned off (PYTHONUTF8=0, -X utf8=0); PYTHONIOENCODING and encoding=\"locale\" are ignored and mean UTF-8 (narrowed in v0.4: CPython 3.15 has UTF-8 mode on by default, PEP 686)"
status = "decided"
decision = 10
lint = "yes"

[deviations.D-16]
summary = "sys.implementation.name is 'bella' and platform.python_implementation() is 'Bella'; sys.implementation.cache_tag and __spec__.cached are None, and importlib.util.cache_from_source raises NotImplementedError, as CPython does for an implementation with no bytecode cache"
status = "decided"
decision = 12
lint = "yes"
note = "cache_tag and __spec__.cached added by the author 2026-11-05: a compiled program has no .pyc, and the implementation says so"

[deviations.D-17]
summary = "recursion limit: a per-call depth counter raises RecursionError at sys.getrecursionlimit(), default 1000"
status = "decided"
decision = 2
lint = "yes"

[deviations.D-18]
summary = "PYTHONPATH, .pth and .start files, site, and the lazy-imports mode (PYTHON_LAZY_IMPORTS, -X lazy_imports; always normal) are ignored; sys.path reflects the build"
status = "accepted"
lint = "yes"

[deviations.D-19]
summary = "module objects are immortal; functions, classes and every other definition-time object are reference-counted like any other"
status = "accepted"
lint = "no"
note = "narrowed after review round three: a weak reference to a module never dies; compiled code and layouts are immortal metadata the program cannot observe"

[deviations.D-20]
summary = "modules the phase-1 manifest omits behave as not installed (spec section 7): hashlib.pbkdf2_hmac and hashlib.scrypt are absent and hashlib.algorithms_available equals algorithms_guaranteed (no OpenSSL); shutil.get_archive_formats() and get_unpack_formats() list only gztar, tar and zip (no bz2, lzma or zstd; calling the built-in formats is [P2+], C-7-04); a codec outside the phase-1 set raises LookupError; date.isocalendar()'s IsoCalendarDate has the repr CPython's pure-Python _pydatetime gives it, without the 'datetime.' prefix (C-7-09); the line '<Category>: Enable tracemalloc to get the object allocation traceback', which CPython's warning hook adds beneath a shown warning that has a source (an unclosed file's ResourceWarning), is not printed: tracemalloc is excluded (E-03) and left out of _py_warnings' imports, so the hook takes the path its own code has for a tracemalloc that cannot be imported. Only the differences listed here are accepted: another difference between _pydatetime and the C accelerator is a defect until it is listed (review 2026-11-01 astra-low-05)"
status = "accepted"
lint = "partial"
observable = "measured on 3.15.2 with the omitted modules blocked: algorithms_available lacks md5-sha1, ripemd160, sha512_224, sha512_256 and sm3; get_archive_formats and get_unpack_formats list 3 formats instead of 6; repr(date.isocalendar()) is IsoCalendarDate(...) instead of datetime.IsoCalendarDate(...), found when the staging replay ran every case in the phase-1 configuration (docs/staging.md); measured 2026-11-14: an unclosed file's ResourceWarning shown on standard error has three lines in CPython and its first two compiled"
note = "review log D-6, decided 2026-11-01. Lint flags pbkdf2_hmac, scrypt, algorithms_available, the missing archive format names, and codec names given as literals outside the phase-1 set; a computed codec name cannot be linted. Providing pbkdf2_hmac and scrypt in the runtime is a later task (TODO.md). The tracemalloc line: the author's decision of 2026-11-14, to accept and list it (the alternative was a stand-in tracemalloc that never traces, reachable from _py_warnings only); it has no lint rule, since any shown warning with a source has it"
expires = "phase 2 (revisit)"

[deviations.D-21]
summary = "a compiled program has no CPython installation: sys.executable is the program, sys.prefix, base_prefix, exec_prefix and base_exec_prefix the directory above the one it is in, and sys.version says bella and the compiler (sys.version_info is the pin's)"
status = "accepted"
lint = "yes"
note = "gettext, a P1 module, reads sys.base_prefix when it imports and argparse reads sys.executable, neither in the spec's sys surface; proposed and accepted by the author 2026-11-06, with the lint rule: a read of sys.executable is flagged, since a program that starts [sys.executable, '-m', ...] or [sys.executable, '-c', ...] starts itself, not an interpreter"


[deviations.D-23]
summary = "after `del obj.__dict__`, a method call `obj.m()` as the first thing asked of the object counts as a plain read and gives it an ordinary dict; CPython's call form asks nothing of the instance (_PyObject_GetMethod), so there the next plain read or write still decides which dict the object gets"
status = "accepted"
lint = "yes"
observable = "only the order in which the object's attribute values are released. Measured on 3.15.2: for a class whose keys are y, z, `del o.__dict__; o.m(); o.z = Z(); o.y = Y(); del o` releases y then z (a dict that shares the class's keys); a compiled program, eval1 and eval2 release z then y (an ordinary dict). No difference when the class defines __getattr__ or __getattribute__ (its call form is a read in CPython too), for an int's or a tuple's subclass (no values kept in the object), or when anything but a call comes first (C-3-58)"
note = "the author's decision of 2026-11-11, as a stop-gap to reconsider: the dropped state itself is in the reference model and the header and is exact; this row would need the compiler to tell a call's load from a plain one through L1, L2, the backend and both evaluators. Pinned by pipeline/tests/test_instance_dict.py, which fails when the two agree. Lint flags `del <expr>.__dict__` and `delattr(<expr>, \"__dict__\")`"
expires = "phase 2 (revisit)"

[deviations.D-24]
summary = "a build with fidelity \"lean\" (pipeline/build.py --fidelity lean, BELLA_FIDELITY=lean) leaves out what is listed here, for speed on well-tested programs: its generated code never looks for a pending signal, so a Python signal handler runs only where the runtime itself looks (when a call that sends a signal or waits is over, before a call that may wait, and in a wait a signal interrupts), where CPython also looks at every function's entry and every loop's turn; SIGINT is not taken at start (no default_int_handler), so Ctrl-C ends the program by the signal; a handler is given None for its frame; and a failed write to the wakeup descriptor is reported when the handlers are over, where CPython reports it at the handler's entry. An exact build, the default, has none of this"
status = "accepted"
lint = "yes"
observable = "measured on the first lean build (2026-11-11): case C-7-75 prints False for 'SIGINT has its handler' at start, NoneType for a handler's frame (two lines), and the wakeup write's report after the handler where CPython prints it before (two lines); in C-7-76 every row whose handler must run in a busy loop, a recursion or a generator gives up, and the blocking rows agree. pipeline/tests/test_signals.py pins the rest (test_d24_*), and test_lean_keeps_every_look_of_the_runtime that the runtime's looks stay"
note = "the author's decisions of 2026-11-11: compiled code looks for signals where CPython's evaluation loop does, \"with a compile flag/switch, so that one can choose C for production code (under a broader flag that drops these rare compatibility items for the sake of speed on well tested programs)\", a handler's frame None under it; the name fidelity = \"exact\" | \"lean\" confirmed the same day. One runtime library serves both builds: -DBELLA_LEAN reaches only the units compiled from the program and the standard library (pipeline/build.py, _unit_flags), and the main unit hands the runtime BELLA_IS_LEAN. Another rare-compatibility item may join the switch only with the author's approval, listed here. Lint, for a lean build: a program that installs a Python handler (signal.signal with a callable) or reads a handler's frame"

[deviations.D-25]
summary = "in an exact build a pending signal's Python handler runs where CPython's evaluation loop looks (a frame's start, a loop's turn, a break CPython compiles backward) and where its C looks in the calls that wait or send a signal, except: (a) CPython also looks when any call of a built-in is over (_CHECK_PERIODIC_AT_END); compiled code does not, so a signal noted in straight-line code is handled at the next frame start, loop turn, or call that waits or signals; (b) CPython's block layout makes a few backward jumps that are not breaks (the end of a match case or of a with statement that ends an except clause; a conditional jump from code only a handler reaches back into code the normal path reaches); (c) all, any, tuple, list or set called with one generator expression is a loop in the caller in CPython, with its turn's look there; compiled, the generator's resume look runs the handler in the <genexpr> frame; (d) importlib's Python looks at a first import are not repeated (runtime/prelude/bootstrap.py is prelude), so the handler runs at the imported module's entry; (e) the looks CPython's C takes in work of its own are taken (the regular-expression engine every 4096 steps; PyObject_Str and PyObject_Repr before they ask the object, so str(), repr(), ascii(), print and the formatting that goes through them; an int's decimal text; the rows of a long product and the words of a long quotient: case C-7-85), but for what follows from the size of an int's digits and from what is Python in the one and C in the other: CPython's ints have 30-bit digits and its multi-digit loops look from 2**30 on, where a compiled program's ints are one machine word up to 2**62 and its loops look when both operands have two words or more (2**64), so a product, quotient, remainder or power with an operand between the two does not look; a quotient or remainder of two integer literals of that length, which CPython's compiler folds, is computed when the program runs, and looks; where CPython hands a long conversion or division to its Python module _pylong, a handler that lists the stack sees that module's frames, and compiled there are none; and a built-in function the runtime writes in Python that puts a number of its own into a message asks for the number's text as a program would, and looks, where the C prints it itself; (f) a handler owed when an uncaught exception other than SystemExit is reported runs in CPython inside the default excepthook, given its frame, and what it raises is swallowed; compiled, it runs at the look after the report and is given None"
status = "accepted"
lint = "partial"
observable = "only with a Python signal handler and a signal made pending at exactly such a point: which frame and line the handler runs in, which try catches what it raises, and the order against other output. Measured on 3.15.2 (2026-11-11): (b) a handler made pending by a match case at the end of an except clause runs at the case body's last line in CPython and at the next frame start or loop turn compiled; (c) a raising handler's traceback lists no <genexpr> entry in CPython and one compiled; (d) CPython's handler runs in _find_and_load. Cases C-7-75 and C-7-76 avoid these shapes"
note = "the author's decision of 2026-11-11 (option A, CPython's own check sites), with (a) approved the same day as a note of this register; (b) to (f) were found while writing the increment's backend and runtime and are listed so that none stays silent; they were first committed as accepted, in error, and then held pending. The author's decision of 2026-11-14: (b), (c), (d) and (f) are accepted; (e) was not: it is to be closed and stays listed until it is (measured that day: a handler that raises interrupted a regular-expression match of several seconds after 1 s in CPython and only when the match was over, after 7 s, compiled). Closed the same day but for the four differences (e) now names (C-7-85: a match, long arithmetic and the conversions are left by a handler that raises, and a handler owed runs in str(), repr(), print and their like before the object is asked, in the frame that asked); those four are put to the author, hence still listed. Lint: (c), the call shape in a program that installs a handler"
expires = "phase 2 (revisit)"

[deviations.D-26]
summary = "signal.sigtimedwait returns None when the time was used up while handlers of signals that interrupted the wait ran; CPython 3.15.2 returns a struct_siginfo made from a siginfo_t nothing wrote"
status = "accepted"
lint = "no"
observable = "measured on 3.15.2 (2026-11-11): with a 0.3 s timeout and a handler that keeps interrupting it every 50 ms, CPython returned a struct_siginfo of whatever the stack held, twice in a few runs; compiled, None. Case C-7-76 prints only how long such a wait took"
note = "approved by the author on 2026-11-11 with the _signal increment: CPython's answer is undefined behaviour of its own (signalmodule.c, signal_sigtimedwait_impl, which leaves the loop on a deadline it computed after the handlers without clearing si), so no program can rely on it; None is what the same call gives when the wait times out without a handler"
