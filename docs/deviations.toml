[deviations.D-17]
summary = "recursion limit: a per-call depth counter raises RecursionError at sys.getrecursionlimit(), default 1000. The counter takes an entry per call of a function written in Python. Where CPython counts otherwise, the depth a program reaches with a given limit differs: CPython takes a second entry for a class's call that its specialised call serves (a call written with positional arguments only, of a class whose metaclass is `type` and whose `__new__` is `object`'s, that enters an `__init__` written in Python without `*args`, `**kwargs` or keyword-only parameters; and not for every such call: not a call site's first, nor each at a site that calls more than one class), so a recursion through such calls reaches about twice the depth compiled that it reaches under CPython, never less; and the frames of CPython's import system that a closed world of one thread does without: its path finder and its reading of a module's code, which run before the module's body, and its module locks, which also run when an import finds its module initialising and when a lock goes (D-33). A compiled call uses the program's stack (256 MiB for the main thread by default, the policy's main_stack_mib), so a limit raised past what it holds, or a walk of data nested deeper, raises RecursionError where the stack is nearly used, which CPython reaches at another depth or not at all"
status = "decided"
decision = 2
lint = "partial"
observable = "measured on 3.15.2 (2026-11-26; `pipeline/tests/test_recursion_counts.py`, limits 60 and 150, twice each): a recursion through `Made()` whose `__init__` calls `Made()` reaches 29, 28, 73, 73 under CPython and 57, 57, 147, 147 compiled, as a plain function does on both; so does one whose `__init__` has a default left out; a site that calls two classes in turn 38, 37, 97, 97 against 56, 56, 146, 146. A class called with a keyword, with `*args` or `**kwargs`, one whose `__init__` takes `*args`, `**kwargs` or a keyword-only parameter, a subclass of Exception, list, dict or str, a class with a Python `__new__`, one under a metaclass or `abc.ABC`, and `type.__call__` take one entry on both sides (fifteen rows compared)"
note = "the class's call: the author's decision of 2026-11-26 (Question 38 put again; of two: A, one entry everywhere and these words; B, two entries where CPython's instruction can serve the call, a test at every class's call and words for the rest): A. It replaces the answer of 2026-11-24 (two entries for every class's call that enters a Python `__init__`), which was put on one measured shape; review F48 measured fifteen (RL-979). Lint: `sys.setrecursionlimit`, and a handler of `RecursionError`"

[deviations.D-18]
summary = "PYTHONPATH, .pth and .start files, site, the lazy-imports mode (PYTHON_LAZY_IMPORTS, -X lazy_imports; always normal) and PYTHONWARNINGS are ignored; sys.path reflects the build; the warning filters a program starts with are those CPython has without PYTHONWARNINGS and -W, and sys.warnoptions is empty. So is every other variable that configures CPython's start-up and that the specification does not say is read (read: PYTHONHASHSEED, PYTHONUNBUFFERED, PYTHONINTMAXSTRDIGITS, PYTHON_CPU_COUNT, PYTHONCOERCECLOCALE, and PYTHONBREAKPOINT as D-11 says). Of the ignored ones these change what a script sees under CPython: PYTHONOPTIMIZE (__debug__ and assert; D-09), PYTHONDEVMODE (sys.flags.dev_mode, the warning filters), PYTHONWARNDEFAULTENCODING (an EncodingWarning at open() without an encoding), PYTHONDONTWRITEBYTECODE and PYTHONPYCACHEPREFIX (sys.dont_write_bytecode, sys.pycache_prefix), PYTHONSAFEPATH, PYTHONNOUSERSITE, PYTHONDEBUG, PYTHONVERBOSE and PYTHONINSPECT (a field of sys.flags; the lines of -v; the prompt after the script), PYTHONMALLOCSTATS and PYTHONPROFILEIMPORTTIME (a table on standard error)"
status = "accepted"
lint = "yes"
note = "PYTHONWARNINGS by the author's decision of 2026-11-20 (of three: honoured everywhere, with CPython's option parser in the runtime; honoured in a program that holds `warnings`; ignored), taken for now, with the first kept to be looked at again (TODO, Later). Measured on 3.15.2: under PYTHONWARNINGS=error CPython has sys.warnoptions == ['error'] and raises the DeprecationWarning of `~True`; a compiled program has an empty list and prints the warning, as CPython does without the variable (pipeline/tests/test_start_up_environment.py; review log RL-483). The lint rule is the older one, for writes to sys.path: a variable of the environment is not in the program's text. The other variables by the author's decision of the same day (of three: the class named as ignored; that, with PYTHONUNBUFFERED, PYTHONINTMAXSTRDIGITS and PYTHON_CPU_COUNT honoured, which was taken; the paragraph left as it was), after a probe under 42 settings on both sides (review log RL-527); case C-8-16 holds the three and PYTHONHASHSEED, and pipeline/tests/test_start_up_environment.py the ignored ones, each against CPython without the variable"

