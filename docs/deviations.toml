[deviations.D-33]
summary = "The import system takes no locks. CPython takes a module's lock, by the module's name, to import a module not yet in `sys.modules` and to wait for one still initialising, and holds its global import lock while it does (`_imp.lock_held()` is true in code that runs then; here it is false). So a name that is a str subclass, which `__import__`, `importlib.__import__` and a lazy import's first use hand on as it is (`importlib.import_module` passes an exact str), has its `__hash__` called twice when CPython takes the lock and twice when the lock goes (after the import; after a module's body raised, when that exception is released), and its `__eq__` when it meets another name of the same hash in the lock table (a package's name while its submodules import, a circular import); here neither is called. CPython runs part of this in weakref callbacks, where an exception (a `__hash__` that raises, a `RecursionError` at the limit, a signal handler's) is reported as ignored and the program goes on, and the lock code's frames count toward the recursion limit (D-17). `_frozen_importlib`'s lock machinery (`_ModuleLock`, `_ModuleLockManager`, `_DummyModuleLock`, `_BlockingOnManager`, `_DeadlockError`, `_ImportLockContext`, `_get_module_lock`, `_has_deadlocked`, `_module_locks`, `_blocking_on`, `_WeakValueDictionary`, and `_List`, `_thread` and `_weakref`, which CPython binds for it) stops the program with a message naming D-33; `_lock_unlock_module` takes nothing and returns `None` whatever its argument; and the code objects of `_find_and_load` and `_lock_unlock_module` have no local `lock`"
