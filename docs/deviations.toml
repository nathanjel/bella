lint = "yes"

[deviations.D-03]
summary = "`is` between equal immutable values may differ from CPython's in either direction: equal small-integer immediates and equal interned strings are identical more often; a tuple of constants is a new object at each evaluation where CPython's compiler makes it one constant; a library function may give back the object it was given where CPython's makes an equal new one, or the other way. Identity only: values, hashes and the calls made into the program's own code agree. Where an identity difference changes another observable, it is a defect, not this deviation"
status = "accepted"
decision = 1
lint = "yes"
note = "CPython itself warns on code that depends on this. Widened by the author on 2026-11-24 (Question 37: B): it named small ints and interned strings, true more often; reviews A28 and A32 found the other direction (RL-623, a tuple of constants; RL-699 to RL-704, RL-719, RL-720, which of two equal objects a library function gives back). Tuples of constants are also to be folded as CPython's compiler folds them (TODO), so RL-623 agrees; inexact folding stays covered. The boundary is Question 29's: the extra `__hash__` calls of a starred call to a cache were a defect. Lint (bella-lint, not written yet): `is` or `is not` with a literal operand, or one whose declared type is int, float, complex, str, bytes, tuple or frozenset"

[deviations.D-04]
summary = "reference cycles are collected at a different moment and their members are finalised in a different order among themselves; an object the runtime makes on demand while a finaliser runs may keep its class to a later collection; what a collection counts, and the objects gc.garbage holds under DEBUG_SAVEALL and their order, are the runtime's own"
status = "accepted"
lint = "partial"
note = "PEP 442's cyclic sequence (weakrefs cleared, finalisers, resurrection check, clear) is kept; only timing and order among members differ. With the collector by trial deletion (the author's decisions of 2026-11-14; runtime/include/bella/object.hpp, 2026-11-23): there are no generations and every collection is a full one, gc.collect(generation) checking its argument and otherwise ignoring it; what gc.collect() returns, gc.get_count(), gc.get_stats() and the numbers gc.callbacks are given are the runtime's own, in CPython's shapes; an automatic collection runs when the candidates pass the first threshold and a quarter of the objects tracked after the last one (a lint rule for a gc.collect() result, get_count(), get_stats() or gc.garbage that reaches output is to come with bella-lint). The author's decision of 2026-11-28 (Question 58; of three: N, these words; W, no promise that one collection frees a cycle; K, a complete collection kept and RL-1040 fixed in the collector): a class's __mro__ tuple and its namespace view are made when first read, so one a finaliser reads first during a collection is a new object holding the class, and PEP 442's resurrection check keeps the class to the next collection; measured on 3.15.2 (pipeline/tests/review_f48/gcmoment): a class whose instance's __del__ reads type(self).__mro__ first, or whose __slots__ subclass's inherited __del__ reads type(self).__dict__ first, is dead after one gc.collect() under CPython and after two compiled (RL-1040); under DEBUG_SAVEALL a module's cycle gives gc.garbage as ['dict', 'module'] under CPython and ['module', 'dict'] compiled (RL-1049), and a class's cycle holds a mappingproxy and one tuple compiled where CPython's holds three tuples (RL-1103). gc.collect(generation) is a full collection here, which the spec does not promise."

