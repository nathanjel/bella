# Deviation register (dialect specification v0.7, section 11), machine-readable.
# The conformance harness and bella-lint read this file. A difference from the reference CPython
# (bella.toml, 3.15.2) that is not listed here is a defect. Fields: status = accepted | decided | pending; lint = yes | partial | no;
# expires = the phase in which a temporary deviation ends, if any.

[deviations.D-01]
summary = "id() returns a runtime address that differs from CPython's and may be reused differently"
status = "accepted"
decision = 1
lint = "yes"
observable = "unobservable in value; identity relationships are preserved up to a consistent renaming within one run"

[deviations.D-02]
summary = "default __repr__ prints a different address after 'at 0x'"
status = "accepted"
decision = 1
lint = "yes"

[deviations.D-03]
summary = "`is` between equal immutable values may differ from CPython's in either direction: equal small-integer immediates and equal interned strings are identical more often; a tuple of constants is a new object at each evaluation where CPython's compiler makes it one constant; a library function may give back the object it was given where CPython's makes an equal new one, or the other way. Identity only: values, hashes and the calls made into the program's own code agree. Where an identity difference changes another observable, it is a defect, not this deviation"
status = "accepted"
decision = 1
lint = "yes"
note = "CPython itself warns on code that depends on this. Widened by the author on 2026-11-24 (Question 37: B): it named small ints and interned strings, true more often; reviews A28 and A32 found the other direction (RL-623, a tuple of constants; RL-699 to RL-704, RL-719, RL-720, which of two equal objects a library function gives back). Tuples of constants are also to be folded as CPython's compiler folds them (TODO), so RL-623 agrees; inexact folding stays covered. The boundary is Question 29's: the extra `__hash__` calls of a starred call to a cache were a defect. Lint (bella-lint, not written yet): `is` or `is not` with a literal operand, or one whose declared type is int, float, complex, str, bytes, tuple or frozenset"

[deviations.D-04]
summary = "reference cycles are collected at a different moment and their members are finalised in a different order among themselves"
status = "accepted"
lint = "partial"
note = "PEP 442's cyclic sequence (weakrefs cleared, finalisers, resurrection check, clear) is kept; only timing and order among members differ. With the collector by trial deletion (the author's decisions of 2026-11-14; runtime/include/bella/object.hpp, 2026-11-23): there are no generations and every collection is a full one, gc.collect(generation) checking its argument and otherwise ignoring it; what gc.collect() returns, gc.get_count(), gc.get_stats() and the numbers gc.callbacks are given are the runtime's own, in CPython's shapes; an automatic collection runs when the candidates pass the first threshold and a quarter of the objects tracked after the last one (a lint rule for a gc.collect() result, get_count() or get_stats() that reaches output is to come with bella-lint)"

[deviations.D-05]
