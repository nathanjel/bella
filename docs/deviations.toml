[deviations.D-17]
summary = "recursion limit: a per-call depth counter raises RecursionError at sys.getrecursionlimit(), default 1000. The counter takes an entry per call of a function written in Python. Where CPython counts otherwise, the depth a program reaches with a given limit differs: CPython takes a second entry for a class's call that its specialised call serves (a call written with positional arguments only, of a class whose metaclass is `type` and whose `__new__` is `object`'s, that enters an `__init__` written in Python without `*args`, `**kwargs` or keyword-only parameters; and not for every such call: not a call site's first, nor each at a site that calls more than one class), so a recursion through such calls reaches about twice the depth compiled that it reaches under CPython, never less; CPython's specialised instructions enter some frames without checking the limit (a generator resumed by `for` or `yield from`, a call with `*args` or `**kwargs`, a bound method object called with a keyword, and, until its frame block is full, a property's getter and a `__getitem__` reached by subscript), so a recursion made only of such frames runs past the limit under CPython and raises `RecursionError` at the limit in a compiled program; and the frames of CPython's import system that a closed world of one thread does without: its path finder and its reading of a module's code, which run before the module's body, and its module locks, which also run when an import finds its module initialising and when a lock goes (D-33). A compiled call uses the program's stack (256 MiB for the main thread by default, the policy's main_stack_mib), so a limit raised past what it holds, or a walk of data nested deeper, raises RecursionError where the stack is nearly used, which CPython reaches at another depth or not at all"
status = "decided"
decision = 2
lint = "partial"
observable = "measured on 3.15.2 (2026-11-26; `pipeline/tests/test_recursion_counts.py`, limits 60 and 150, twice each): a recursion through `Made()` whose `__init__` calls `Made()` reaches 29, 28, 73, 73 under CPython and 57, 57, 147, 147 compiled, as a plain function does on both; so does one whose `__init__` has a default left out; a site that calls two classes in turn 38, 37, 97, 97 against 56, 56, 146, 146. A class called with a keyword, with `*args` or `**kwargs`, one whose `__init__` takes `*args`, `**kwargs` or a keyword-only parameter, a subclass of Exception, list, dict or str, a class with a Python `__new__`, one under a metaclass or `abc.ABC`, and `type.__call__` take one entry on both sides (fifteen rows compared). The frames entered without a check, at the default limit (`pipeline/tests/test_review_2026_11_26_f48.py`, `unchecked`): 1,200 generators chained by `yield from` or by `for` and then resumed give their value under CPython and RecursionError compiled, and so does a recursion 1,200 deep through `f(n - 1, *rest)`, `f(n - 1, **rest)` or a bound method object called with a keyword; at 900 both end; a recursive generator (`yield from walk(depth - 1)`), the lazy sieve of one filter generator a prime (its `for` also meets what is no generator) and a decorated recursion raise on both sides at 1,200. An endless recursion through `*args` ends CPython with a segmentation fault"
note = "the class's call: the author's decision of 2026-11-26 (Question 38 put again; of two: A, one entry everywhere and these words; B, two entries where CPython's instruction can serve the call, a test at every class's call and words for the rest): A. It replaces the answer of 2026-11-24 (two entries for every class's call that enters a Python `__init__`), which was put on one measured shape; review F48 measured fifteen (RL-979). The frames entered without a check: the author's decision of 2026-11-26 (Question 49, RL-980; of two: A, these words; B, such frames not counted in a compiled program, which then never raises where CPython ends and runs on where CPython does check): A. Lint: `sys.setrecursionlimit`, and a handler of `RecursionError`"

