name: ci
on:
  push:
  pull_request:

jobs:
  pinned:
    name: GCC 16.2.0 + CPython 3.15.2 (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned toolchain image
        run: docker build -t bella .
      - name: make closure
        # Not closed on 3.15.2 until Gate 0, task 1 (TODO.md); remove continue-on-error then.
        continue-on-error: true
        run: docker run --rm bella make closure
      - name: make test record probes slice int-test
        run: docker run --rm bella make test record probes slice int-test
      - name: Keep the probe report
        if: always()
        run: docker run --rm bella cat toolchain-probes.md > toolchain-probes.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-probes
          path: toolchain-probes.md

  unpinned-smoke:
    name: developer-machine smoke (runner's g++, c++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3   # no floating major tags are published
        with:
          version: "0.13.6"
      - run: uv sync --extra dev --frozen
      - run: uv run make test
      - run: uv run python -m refmodel.selftest --iterations 5000
      - run: uv run python tools/closure.py --allow-unpinned --quiet
        continue-on-error: true   # until Gate 0, task 1 (TODO.md)
      - run: uv run make slice CXXSTD=c++23
      - run: uv run make int-test CXXSTD=c++23 --silent
