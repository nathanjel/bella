name: ci
on:
  push:
  pull_request:

jobs:
  pinned:
    name: GCC 16.2.0 + CPython 3.15.2 (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned toolchain image
        run: docker build -t bella .
      - name: make closure (and the committed lock is what the pinned image computes)
        run: docker run --rm bella sh -c 'cp closure.lock.json /tmp/committed.json && make closure && cmp closure.lock.json /tmp/committed.json'
      - name: make targets-closure (and the committed target closures and increments are current)
        run: docker run --rm bella sh -c 'cp -r targets/closure /tmp/tc && cp targets/closure-summary.json /tmp/tcs.json && make targets-closure && diff -r /tmp/tc targets/closure && cmp /tmp/tcs.json targets/closure-summary.json'
      - name: make checks (lint test verify probes slice int-test float-diff object-test targets-check staging-check eval1-corpus eval2-corpus compiled-corpus targets-eval1 targets-eval2 targets-compiled, at once)
        run: docker run --rm bella make checks
      - name: Keep the probe report
        if: always()
        run: docker run --rm bella cat toolchain-probes.md > toolchain-probes.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-probes
          path: toolchain-probes.md

  unpinned-smoke:
    name: developer-machine smoke (runner's g++, c++23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3   # no floating major tags are published
        with:
          version: "0.13.6"
      - run: uv sync --extra dev --frozen
      - run: uv run make lint
      - run: uv run make test
      - run: uv run python -m refmodel.selftest --iterations 5000
      - run: uv run python tools/closure.py --allow-unpinned --quiet --out /tmp/closure.lock.json
      - run: uv run python tools/closure.py --allow-unpinned --quiet --all-targets
      - run: uv run make slice CXXSTD=c++23
      - run: uv run make int-test CXXSTD=c++23 --silent
      - run: uv run make -j3 object-test CXXSTD=c++23
      - run: uv run python targets/run_targets.py check
      - run: uv run make staging-check
      - run: uv run make eval1-corpus
      - run: uv run make eval2-corpus
      - run: uv run make targets-eval1
      - run: uv run make targets-eval2
